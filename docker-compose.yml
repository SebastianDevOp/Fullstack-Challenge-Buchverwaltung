services:
  api:
    build: backend/book-api/
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/challenge
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: challenge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ CMD-SHELL, "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  recommendations:
    build: backend/recommendation-service
    ports:
      - "8081:8081"
    environment:
      - BOOKS_API_URL=http://api:8080
    depends_on:
      - api

volumes:
  pgdata:
